<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoilStack by Han | Input Data Susunan Piramid</title>
    <!-- Tailwind CSS (versi dipin agar stabil; CDN ini tidak mengirim CORS sehingga tidak bisa diberi SRI) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <!-- HTML5-QRCode untuk Scan QR via Kamera / Foto HP -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
        integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"
        crossorigin="anonymous"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'sans-serif'],
                            mono: ['JetBrains Mono', 'monospace'],
                        },
                        colors: {
                            industrial: {
                                900: '#0f172a',
                                800: '#1e293b',
                                700: '#334155',
                                accent: '#f59e0b',
                            }
                        }
                    }
                }
            };
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Toast Notification Container (Pengganti alert()) -->
    <div id="toast-container" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-80 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Confirmation Modal (Pengganti confirm()) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 transform transition-all">
            <div class="flex items-center gap-3 text-amber-600 mb-3">
                <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <h3 id="modal-title" class="font-bold text-lg text-slate-900">Konfirmasi</h3>
            </div>
            <p id="modal-message" class="text-sm text-slate-600 mb-6 leading-relaxed">Apakah Anda yakin?</p>
            <div class="flex gap-3 justify-end">
                <button type="button" id="modal-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Batal</button>
                <button type="button" id="modal-confirm" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-red-600 hover:bg-red-700 transition shadow-sm">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- Header & Status Bar -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-extrabold text-lg shadow-inner shrink-0" id="header-pattern-badge">
                    321
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight">CoilStack <span class="text-amber-400">by Han</span></h1>
                    <p class="text-[11px] sm:text-xs text-slate-400 italic">Lahir dari pikiran manusia, Dibangun dengan AI</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button type="button" onclick="openCoilSearch()" title="Cari data coil" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-white text-xs sm:text-sm font-semibold px-2.5 py-2 rounded-xl flex items-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span class="hidden sm:inline">Cari</span>
                </button>
                <button type="button" onclick="openCoilSummary()" title="Buka ringkasan semua coil" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 text-xs sm:text-sm font-semibold px-2.5 py-2 rounded-xl flex items-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-list-check"></i>
                    <span class="hidden sm:inline">Ringkasan</span>
                </button>
                <button type="button" onclick="openImportSyncModal()" title="Impor & gabungkan rekapan CSV atau WhatsApp" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-file-import"></i>
                    <span class="hidden sm:inline">Impor / Gabung</span>
                    <span class="sm:hidden">Impor</span>
                </button>
                <button type="button" onclick="openExportModal()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-file-export"></i>
                    <span class="hidden sm:inline">Ekspor / Rekap</span>
                    <span class="sm:hidden">Rekap</span>
                </button>
            </div>
        </div>

        <!-- Bar Informasi Lokasi, PIC/Shift, Pola Susunan & Total Layer -->
        <div class="bg-slate-800 border-t border-slate-700/80 px-4 py-2.5">
            <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-slate-400 font-medium">Lokasi:</span>
                    <select id="location-select" onchange="switchLocation(this.value)"
                        class="bg-slate-900/90 border border-slate-600 rounded-lg px-2.5 py-1 text-white font-mono font-bold max-w-[140px] sm:max-w-[180px] focus:outline-none focus:border-amber-400">
                    </select>
                    <button type="button" onclick="openNewLocationModal()" title="Tambah lokasi / bay baru tanpa hapus data lama"
                        class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 transition shadow-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>Lokasi Baru</span>
                    </button>
                    <button type="button" onclick="openRenameLocationModal()" title="Ubah nama lokasi aktif"
                        class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded-lg transition">
                        <i class="fa-solid fa-pen text-[11px]"></i>
                    </button>
                    <button type="button" onclick="openMergeLocationsModal()" title="Gabungkan lokasi"
                        class="bg-sky-950/70 hover:bg-sky-800 text-sky-200 border border-sky-700/60 px-2 py-1 rounded-lg transition">
                        <i class="fa-solid fa-code-merge text-[11px]"></i>
                        <span class="hidden sm:inline ml-1">Gabung Lokasi</span>
                    </button>
                    <button type="button" id="delete-location-btn" onclick="confirmDeleteCurrentLocation()" title="Hapus lokasi ini"
                        class="bg-red-950/70 hover:bg-red-800 text-red-300 border border-red-800/60 px-2 py-1 rounded-lg transition">
                        <i class="fa-solid fa-trash-can text-[11px]"></i>
                    </button>
                </div>

                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-slate-400 font-medium">PIC / Tim:</span>
                    <input type="text" id="pic-name-input" placeholder="Nama PIC / Tim..." oninput="onPicShiftChange()"
                        class="bg-slate-900/90 border border-slate-600 rounded-lg px-2.5 py-1 text-white font-semibold w-[125px] sm:w-[150px] placeholder-slate-500 focus:outline-none focus:border-amber-400">
                    <span class="text-slate-400 font-medium ml-1">Shift:</span>
                    <select id="shift-select" onchange="onPicShiftChange()"
                        class="bg-slate-900/90 border border-slate-600 rounded-lg px-2 py-1 text-sky-300 font-mono font-bold focus:outline-none focus:border-amber-400">
                        <option value="Shift 1">Shift 1 (07:30-15:30)</option>
                        <option value="Shift 2">Shift 2 (15:30-23:30)</option>
                        <option value="Shift 3">Shift 3 (23:30-07:30)</option>
                        <option value="Non-Shift">Non-Shift</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-slate-400 font-medium">Susunan:</span>
                    <select id="stack-pattern-select" onchange="onStackPatternChange(this.value)"
                        class="bg-slate-900/80 border border-slate-600 rounded-lg px-2 py-1 text-amber-300 font-mono font-bold focus:outline-none focus:border-amber-400">
                        <option value="3-2-1">3-2-1 (6 Coil)</option>
                        <option value="4-3-2-1">4-3-2-1 (10 Coil)</option>
                        <option value="5-4-3-2-1">5-4-3-2-1 (15 Coil)</option>
                        <option value="2-1">2-1 (3 Coil)</option>
                        <option value="CUSTOM">Custom...</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-slate-400 font-medium">Total Layer:</span>
                    <div class="flex items-center bg-slate-900 rounded-lg border border-slate-600 overflow-hidden">
                        <button type="button" onclick="changeLayerCount(-1)" class="px-2.5 py-1 hover:bg-slate-700 text-slate-300 font-bold active:bg-slate-600">-</button>
                        <span id="total-layers-display" class="px-3 py-1 font-mono font-bold text-amber-400">2</span>
                        <button type="button" onclick="changeLayerCount(1)" class="px-2.5 py-1 hover:bg-slate-700 text-slate-300 font-bold active:bg-slate-600">+</button>
                    </div>
                </div>

                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <span class="text-slate-400">Terisi:</span>
                    <span id="progress-badge" class="bg-slate-700 text-amber-300 font-mono font-bold px-2.5 py-0.5 rounded-full">0 / 12</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-5">

        <!-- Mode Switcher Tabs -->
        <div class="grid grid-cols-2 sm:grid-cols-4 bg-slate-200/90 p-1 rounded-2xl border border-slate-300/60 gap-1">
            <button type="button" id="tab-crawl" onclick="switchMode('crawl')" class="py-2.5 px-2 sm:px-3 rounded-xl text-[11px] sm:text-sm font-bold flex items-center justify-center gap-1.5 transition bg-white text-slate-900 shadow-sm">
                <i class="fa-solid fa-person-crawling text-amber-500"></i>
                <span>Piramid (Merangkak)</span>
            </button>
            <button type="button" id="tab-nonpyramid" onclick="switchMode('nonpyramid')" class="py-2.5 px-2 sm:px-3 rounded-xl text-[11px] sm:text-sm font-bold flex items-center justify-center gap-1.5 transition text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-cubes-stacked text-sky-500"></i>
                <span>Non-Piramid (<span id="nonpyramid-tab-count">0</span>)</span>
            </button>
            <button type="button" id="tab-layer" onclick="switchMode('layer')" class="py-2.5 px-2 sm:px-3 rounded-xl text-[11px] sm:text-sm font-bold flex items-center justify-center gap-1.5 transition text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-layer-group text-slate-400"></i>
                <span>Lihat Per Layer</span>
            </button>
            <button type="button" id="tab-production" onclick="switchMode('production')" class="py-2.5 px-2 sm:px-3 rounded-xl text-[11px] sm:text-sm font-bold flex items-center justify-center gap-1.5 transition text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-industry text-rose-500"></i>
                <span>Dipakai Produksi</span>
            </button>
        </div>

        <div id="view-crawl-container"></div>
        <div id="view-non-pyramid-container"></div>
        <div id="view-layer-review-container"></div>
        <div id="view-production-container"></div>
    </main>

    <div id="app-modals-container"></div>

    <script>
        (async () => {
            const fragments = [
                ['view-crawl-container', 'views/crawl.html'],
                ['view-non-pyramid-container', 'views/non-pyramid.html'],
                ['view-layer-review-container', 'views/layer-review.html'],
                ['view-production-container', 'views/production.html'],
                ['app-modals-container', 'views/modals.html']
            ];
            for (const [containerId, url] of fragments) {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Gagal memuat ${url}`);
                document.getElementById(containerId).innerHTML = await response.text();
            }
            const appScript = document.createElement('script');
            appScript.src = 'assets/js/app.js';
            document.body.appendChild(appScript);
        })().catch(error => {
            document.body.innerHTML = `<main class="min-h-screen flex items-center justify-center p-6 text-center"><div><h1 class="text-lg font-bold text-red-700">Aplikasi gagal dimuat</h1><p class="mt-2 text-sm text-slate-600">${error.message}</p></div></main>`;
        });
    </script>
</body>
</html>
