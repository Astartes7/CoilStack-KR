<!-- ========================================================= -->
        <!-- VIEW 2: MODE TINJAU PER LAYER (TAMPAK DEPAN PER BARIS)    -->
        <!-- ========================================================= -->
        <section id="view-layer" role="tabpanel" aria-labelledby="tab-layer" class="hidden flex-col gap-4">
            <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-100">
                    <div>
                        <h2 class="text-base font-bold text-slate-900">Tinjauan Susunan Per Layer (<span id="overview-pattern-label">3-2-1</span>)</h2>
                        <p class="text-xs text-slate-500">Setiap baris piramid merepresentasikan 1 layer dari depan ke belakang</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold text-slate-600">Pilih Layer:</span>
                        <select id="view-layer-selector" onchange="renderLayerOverview()" class="bg-slate-100 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono font-bold text-slate-800 focus:outline-none focus:border-amber-500">
                            <!-- Diisi dinamis -->
                        </select>
                    </div>
                </div>

                <!-- Visual Piramid Besar untuk 1 Layer Terpilih -->
                <div id="layer-pyramid-detail" class="bg-slate-50 rounded-2xl p-4 sm:p-6 border border-slate-200 flex flex-col items-center gap-3">
                    <!-- Dirender oleh JS -->
                </div>
            </div>

            <!-- Tabel Ringkasan Semua Layer -->
            <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 overflow-hidden">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-bold text-slate-900">Daftar Lengkap Coil (<span id="overview-bay-name">BAY-A01</span>)</h3>
                    <button type="button" onclick="confirmResetAll()" class="text-xs font-semibold text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-trash-can mr-1"></i> Reset Lokasi Ini
                    </button>
                </div>
                <div id="matrix-table-wrap" class="hidden sm:block overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                <th class="p-2.5 font-bold">Layer</th>
                                <th class="p-2.5 font-bold">Posisi</th>
                                <th class="p-2.5 font-bold">Nomor</th>
                                <th class="p-2.5 font-bold">No. Coil</th>
                                <th class="p-2.5 font-bold">Diameter</th>
                                <th class="p-2.5 font-bold">Grade</th>
                                <th class="p-2.5 font-bold">Heat Number</th>
                                <th class="p-2.5 font-bold">Berat</th>
                                <th class="p-2.5 font-bold">Supplier</th>
                                <th class="p-2.5 font-bold">Tim / PIC</th>
                                <th class="p-2.5 font-bold">Shift</th>
                            </tr>
                        </thead>
                        <tbody id="matrix-table-body" class="divide-y divide-slate-100 font-mono">
                            <!-- Diisi dinamis -->
                        </tbody>
                    </table>
                </div>
                <div id="matrix-mobile-list" class="sm:hidden divide-y divide-slate-200 rounded-xl border border-slate-200 overflow-hidden">
                    <!-- Tampilan kartu yang mudah dibaca pada layar kecil -->
                </div>
            </div>
        </section>

    </main>
