<section id="view-production" role="tabpanel" aria-labelledby="tab-production" class="hidden flex-col gap-4">
    <div class="w-full bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-3">
            <div>
                <h2 class="text-sm font-bold text-slate-900">Tandai Coil Dipakai Produksi</h2>
                <p class="text-xs text-slate-500">Cari atau scan coil pada lokasi aktif</p>
            </div>
            <span id="production-location-badge" class="text-xs font-mono font-bold bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full">Lokasi</span>
        </div>

        <div class="mt-3 bg-slate-900 border border-rose-400/40 rounded-xl p-3 flex flex-col gap-2">
            <label for="production-search-input" class="text-[10px] font-bold uppercase tracking-wider text-rose-300">Scan / Cari Coil</label>
            <div class="flex gap-2">
                <input id="production-search-input" type="text" autocomplete="off"
                    oninput="renderProductionUsageList(this.value)"
                    onkeydown="if(event.key==='Enter'){ event.preventDefault(); renderProductionUsageList(this.value); }"
                    placeholder="No. Coil, Heat Number, atau teks QR..."
                    class="w-full bg-slate-800 border border-slate-600 focus:border-rose-400 rounded-lg px-3 py-2 text-sm font-mono text-white placeholder-slate-500 focus:outline-none">
                <input type="file" id="production-qr-photo-input" accept="image/*" capture="environment" class="hidden" onchange="handleProductionQrPhoto(event)">
                <button type="button" onclick="document.getElementById('production-qr-photo-input').click()" title="Ambil foto QR"
                    class="shrink-0 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 px-3 rounded-lg text-xs font-bold">
                    <i class="fa-solid fa-camera mr-1"></i>Foto
                </button>
                <button type="button" onclick="openQrScannerModal('production')" title="Buka kamera live"
                    class="shrink-0 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 px-3 rounded-lg text-xs font-bold">
                    <i class="fa-solid fa-video mr-1"></i>Scan
                </button>
            </div>
            <button type="button" onclick="pasteProductionFromClipboard()" class="self-start text-[11px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-2.5 py-1 rounded-lg">
                <i class="fa-regular fa-paste mr-1"></i>Tempel dari Clipboard
            </button>
        </div>

        <div class="mt-3 flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-slate-600">Daftar Coil</span>
            <select id="production-status-filter" onchange="renderProductionUsageList(document.getElementById('production-search-input')?.value || '')"
                class="bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700">
                <option value="AKTIF">Aktif</option>
                <option value="ALL">Semua Status</option>
                <option value="DIPAKAI_PRODUKSI">Dipakai Produksi</option>
                <option value="HILANG">Hilang</option>
            </select>
        </div>
        <div id="production-coil-list" class="mt-2 flex flex-col gap-2 max-h-[520px] overflow-y-auto pr-1"></div>
    </div>
</section>
